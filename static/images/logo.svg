<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 44" width="190" height="44" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="hubMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="hubTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Modern Calculation Cube / Shield Icon Mark -->
  <rect x="2" y="4" width="36" height="36" rx="9" fill="url(#hubMarkGrad)" />
  
  <!-- Stylized Math Symbols inside Mark -->
  <circle cx="13" cy="15" r="2" fill="#ffffff" />
  <circle cx="27" cy="15" r="2" fill="#ffffff" />
  <rect x="18" y="14" width="4" height="2" rx="1" fill="#ffffff" />
  <rect x="12" y="27" width="16" height="2.5" rx="1.25" fill="#ffffff" />
  <rect x="12" y="22" width="16" height="2.5" rx="1.25" fill="#ffffff" />

  <!-- Brand Typography -->
  <!-- "Calculator" -->
  <text x="46" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="-0.4">Calculator</text>
  
  <!-- "Hub" with vibrant gradient -->
  <text x="135" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" fill="url(#hubTextGrad)" letter-spacing="-0.2">Hub</text>

  <!-- Subtitle Tagline -->
  <text x="47" y="36" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" fill="#94a3b8" letter-spacing="1.2">PRECISION ENGINES</text>
</svg>
